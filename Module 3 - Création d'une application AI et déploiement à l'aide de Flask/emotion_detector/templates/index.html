<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détecteur d'émotions</title>
  </head>
  <body>
    <main>
      <h1>Détecteur d'émotions</h1>
      <p>Démo locale : les résultats ne constituent pas une analyse psychologique.</p>
      <form id="analysis-form">
        <label for="text">Texte à analyser</label><br>
        <textarea id="text" rows="6" cols="60" required></textarea><br>
        <button type="submit">Analyser</button>
      </form>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <script>
      const form = document.querySelector('#analysis-form');
      const result = document.querySelector('#result');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({text: document.querySelector('#text').value})
        });
        result.textContent = JSON.stringify(await response.json(), null, 2);
      });
    </script>
  </body>
</html>
